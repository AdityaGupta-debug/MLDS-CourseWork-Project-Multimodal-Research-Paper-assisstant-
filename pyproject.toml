[project]
name = "research-paper-multimodal-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aditya", email = "adpubu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "chromadb>=1.5.9",
    "google-genai>=3.0.0",
    "groq>=1.7.0",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
    "transformers>=5.22.2",
]

[project.scripts]
research-paper-multimodal-rag = "research_paper_multimodal_rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
